[tool:pytest]
# Configuration specifically for integration tests
testpaths = tests
python_files = test_integration.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests as integration tests requiring real API
    slow: marks tests as slow running tests
addopts = 
    --verbose
    --tb=short
    -m integration
    --disable-warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning